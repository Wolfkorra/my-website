  site-url: "https://YOUR-GITHUB-USERNAME.github.io/YOUR-REPO-NAME/"
  description: "Portfolio of Abdullah Korra: scientific computing, machine learning, astronomy software, robotics, and reproducible analysis."
  favicon: assets/favicon.png

  open-graph:
    image: assets/social-card.png
    image-alt: "Preview card for Abdullah Korra portfolio"
    site-name: "Abdullah Korra"

  twitter-card:
    card-style: summary_large_image
    image: assets/social-card.png
    image-alt: "Preview card for Abdullah Korra portfolio"

