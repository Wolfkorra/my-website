        href: "https://www.linkedin.com/in/MY-LINKEDIN/"
        aria-label: LinkedIn

  page-footer:
    left: "© 2026 Abdullah Korra"
    right: "Built with Quarto and GitHub Pages"

format:
  html:
    theme: [litera, styles.scss]
    toc: true
    page-layout: article
    smooth-scroll: true
    anchor-sections: true
    code-copy: true
    code-fold: true
    code-summary: "Show code"
    code-overflow: wrap
    link-external-newwindow: true
    include-in-header:
      text: |
        <meta name="author" content="Abdullah Korra">
        <meta name="keywords" content="Python, pandas, scikit-learn, regression, classification, cross-validation, RMSE, ROC-AUC, Git, reproducible workflows, astronomy, robotics, machine learning">
        <meta name="twitter:title" content="Abdullah Korra | Portfolio">
        <meta name="twitter:description" content="Scientific computing, astronomy software, robotics, and reproducible analysis.">
        <meta property="og:title" content="Abdullah Korra | Portfolio">
        <meta property="og:description" content="Scientific computing, astronomy software, robotics, and reproducible analysis.">

execute:
  freeze: auto
  echo: false
  warning: false
  message: false
